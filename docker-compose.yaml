# Watchening: the web UI, a guide builder for zlive's channels, sign-in,
# and a stream proxy.
#
#   docker compose up -d            -> http://localhost:8080
#   docker compose logs accounts    the first admin password (also in data/admin-login.txt)
#   docker compose pull && docker compose up -d   (update; do this now and
#                                   then, as iptv-org fixes guide sites often)
#
# Settings go in a file called .env next to this one (copy .env.example). With
# none, it runs at http://localhost:8080 with sign-in on. Nothing else needs
# setting: the secrets are made on the first start.
#
# What runs:
#   webui      nginx: the app, and the door to everything below
#   epg        builds guide listings for zlive's channels
#   setup      (runs and exits) makes the secrets, writes config from .env
#   kratos     Ory Kratos: accounts and sign-in (kratos-migrate prepares its database)
#   accounts   our small service between nginx and Kratos: checks sign-ins,
#              runs the Users page, makes the first admin
#   mediaflow  MediaFlow Proxy: plays http:// streams on an https:// page, and
#              streams whose servers don't allow web pages
#   speech     voice search: whisper.cpp with FUTO's voice input models, on
#              the CPU (no GPU needed)
#   aiostreams AIOStreams: Stremio addons and a debrid service, for On Demand,
#              with every stream relayed through this server
#
# Only webui is published on a port (and AIOStreams' setup page, on this
# machine only: see AIOSTREAMS_PORT). Settings, groups and uploaded playlists
# are saved per account in ./data/settings (see auth/settings.mjs).

name: watchening

x-logging: &logging
  logging:
    options:
      max-size: "1m"
      max-file: "3"

services:
  webui:
    image: nginx:stable-alpine
    container_name: watchening-webui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-8080}:80"
    volumes:
      # Edits to ./webui show up on the next page load, no rebuild needed.
      - ./webui:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/trusted-proxies.conf:/etc/nginx/trusted-proxies.conf:ro
      - epg:/srv/epg:ro
      - type: volume
        source: auth-secrets
        target: /etc/nginx/mediaflow-password.conf
        read_only: true
        volume:
          subpath: nginx-mediaflow.conf
    depends_on:
      setup:
        condition: service_completed_successfully
      accounts:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    <<: *logging

  # Guide listings for zlive's channels, served at /epg/zlive.xml.gz
  # (the zlive playlist loads it by itself) with a report at /epg/status.json.
  # It runs iptv-org's EPG grabber (github.com/iptv-org/epg) in their own
  # image; ./epg matches zlive's channels to their channel database and
  # picks each channel's best working guide site. The first guide appears a
  # few minutes after start-up, then it's rebuilt every EPG_EVERY_HOURS.
  # It does nothing until ZLIVE_URL is set in .env (no site ships by default).
  epg:
    image: ghcr.io/iptv-org/epg:master
    container_name: watchening-epg
    restart: unless-stopped
    entrypoint: ["node", "/zlive/zlive-epg.mjs"]
    environment:
      ZLIVE_URL: "${ZLIVE_URL:-}"                # the site typed into Settings, Playlists
      EPG_DAYS: "${EPG_DAYS:-3}"                 # days of listings to fetch
      EPG_EVERY_HOURS: "${EPG_EVERY_HOURS:-12}"  # hours between rebuilds
      EPG_MAX_CONNECTIONS: "${EPG_MAX_CONNECTIONS:-5}"
      TZ: UTC
    volumes:
      - ./epg:/zlive:ro
      - epg:/out
      - epg-work:/work
    <<: *logging

  # Runs on every `up`, then exits: secrets on the first start (kept in the
  # auth-secrets volume), and the config files that depend on .env.
  setup:
    image: node:22-alpine
    container_name: watchening-setup
    restart: "no"
    command: ["node", "/app/setup.mjs"]
    environment:
      PUBLIC_URL: "${PUBLIC_URL:-}"
      DEBRID_SERVICE: "${DEBRID_SERVICE:-}"
      DEBRID_API_KEY: "${DEBRID_API_KEY:-}"
      AIOSTREAMS_PORT: "${AIOSTREAMS_PORT:-127.0.0.1:3001}"
    volumes:
      - ./auth:/app:ro
      - auth-secrets:/secrets
      - ./data:/data

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    container_name: watchening-kratos-migrate
    restart: "no"
    command: ["migrate", "sql", "-e", "--yes", "-c", "/etc/config/kratos/kratos.yml", "-c", "/etc/config/generated/kratos.yml"]
    volumes: &kratos-volumes
      - ./auth/kratos:/etc/config/kratos:ro
      - kratos-db:/var/lib/sqlite
      - auth-secrets:/etc/config/generated:ro
    depends_on:
      setup:
        condition: service_completed_successfully
    <<: *logging

  kratos:
    image: oryd/kratos:v26.2.0
    container_name: watchening-kratos
    restart: unless-stopped
    # kratos-flags holds "--dev" when PUBLIC_URL is plain http (see auth/setup.mjs)
    entrypoint: ["sh", "-c", "exec kratos serve -c /etc/config/kratos/kratos.yml -c /etc/config/generated/kratos.yml --sqa-opt-out $$(cat /etc/config/generated/kratos-flags)"]
    environment:
      # unused by Kratos: changing it in .env makes compose restart this, to
      # load the config setup wrote for the new address
      PUBLIC_URL: "${PUBLIC_URL:-}"
    volumes: *kratos-volumes
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:4434/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 1s
    <<: *logging

  accounts:
    image: node:22-alpine
    container_name: watchening-accounts
    restart: unless-stopped
    user: node
    working_dir: /app
    command: ["node", "server.mjs"]
    environment:
      AUTH: "${AUTH:-on}"
      PUBLIC_URL: "${PUBLIC_URL:-}"
    volumes:
      - ./auth:/app:ro
      - ./data:/data
    depends_on:
      kratos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 1s
    <<: *logging

  mediaflow:
    image: mhdzumair/mediaflow-proxy:v2.4.9
    container_name: watchening-mediaflow
    restart: unless-stopped
    environment:
      # nginx only lets signed-in visitors through, and adds the password
      FORWARDED_ALLOW_IPS: "*"
      GUNICORN_WORKERS: "${MEDIAFLOW_WORKERS:-2}"
      GUNICORN_ACCESS_LOGFILE: "/dev/null"   # one line per video segment otherwise
      # only the proxy is used: no web pages of its own, no transcoding
      DISABLE_HOME_PAGE: "true"
      DISABLE_DOCS: "true"
      DISABLE_SPEEDTEST: "true"
      ENABLE_TRANSCODE: "false"
    volumes:
      - type: volume
        source: auth-secrets
        target: /mediaflow_proxy/.env
        read_only: true
        volume:
          subpath: mediaflow.env
    depends_on:
      setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    <<: *logging

  # Voice search, at /stt (nginx). The on-screen keyboard's Voice key records
  # a short clip in the browser and sends it here over the page's https://
  # connection; it's turned into text in memory and nothing is kept. The
  # model (one of FUTO's, see speech/start.sh) is downloaded on the first
  # start, 45 MB for english-39. This image is amd64; on an arm64 server use
  # main-arm64-<the same commit> instead. If it keeps restarting with exit
  # code 132, the CPU is too old for it (no AVX2): see speech/Dockerfile.
  speech:
    image: ghcr.io/ggml-org/whisper.cpp:main-aba02defd6bb6ff5de63721c21e3456645c153e2
    container_name: watchening-speech
    restart: unless-stopped
    entrypoint: ["sh", "/speech/start.sh"]
    environment:
      SPEECH_MODEL: "${SPEECH_MODEL:-english-39}"
      SPEECH_THREADS: "${SPEECH_THREADS:-4}"
      SPEECH_LANGUAGE: "${SPEECH_LANGUAGE:-}"
    volumes:
      - ./speech:/speech:ro
      - speech-models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 2m   # the first start downloads the model
      start_interval: 2s
    <<: *logging

  # Stremio addons for On Demand: AIOStreams (github.com/Viren070/AIOStreams)
  # gathers catalogs (Cinemeta and others) and streams from the addons you
  # pick, asks your debrid service which files it already has (its cache),
  # and offers it all as a media server that speaks Jellyfin's language, at
  # /jellyfin on this site (nginx; signed in). On Demand adds it under
  # Settings, On Demand, "Sign In to Stremio".
  #
  # Every stream it hands out goes through its own proxy, at /api/v1/proxy/
  # on this site: the debrid service sends the file here and only ever sees
  # this server's address, so the whole household can watch at once without
  # it looking like the account is shared. Files are played as they are
  # (never converted): a browser plays MP4 and most MKV with H.264; HEVC,
  # DTS or TrueHD often won't, so pick another version when one doesn't.
  #
  # Set it up on its own page, from this machine: http://localhost:3001/stremio/configure
  # (AIOSTREAMS_PORT; sign in with data/aiostreams-login.txt). Its address,
  # keys and proxy come from .env through setup (aiostreams.env).
  aiostreams:
    image: ghcr.io/viren070/aiostreams:v2.38.1
    container_name: watchening-aiostreams
    restart: unless-stopped
    # (the image has no shell of its own beyond busybox sh: enough to load the file setup wrote)
    entrypoint: ["/bin/sh", "-c", "set -a; . /etc/aiostreams.env; exec /nodejs/bin/node /app/packages/server/dist/server.js"]
    environment:
      # unused by AIOStreams (it reads aiostreams.env): changing these in .env
      # makes compose restart this, to load what setup wrote for them
      PUBLIC_URL: "${PUBLIC_URL:-}"
      DEBRID_SERVICE: "${DEBRID_SERVICE:-}"
    ports:
      # its setup page; keep it off the internet
      - "${AIOSTREAMS_PORT:-127.0.0.1:3001}:3000"
    volumes:
      - aiostreams-data:/app/data
      - type: volume
        source: auth-secrets
        target: /etc/aiostreams.env
        read_only: true
        volume:
          subpath: aiostreams.env
    depends_on:
      setup:
        condition: service_completed_successfully
    <<: *logging

volumes:
  epg:           # the finished guide, shared with nginx
  epg-work:      # last run's listings and which sites have been failing
  auth-secrets:  # made on the first start: Kratos's keys, MediaFlow's and AIOStreams' passwords
  kratos-db:     # accounts (SQLite)
  speech-models: # FUTO's voice input model, downloaded on the first start
  aiostreams-data: # AIOStreams' setups (SQLite) and caches
