<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Listings</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===================== TV / VIDEO =====================
     Lives outside the 800x600 (16:9 mode: 1067x600) stage so it can fill the whole window while
     watching. In the guide and settings it is positioned over #pipslot. -->
<div id="tv" class="pip">
  <canvas id="tv-canvas" width="400" height="300"></canvas>
  <video id="tv-video" playsinline></video>
  <div id="cc" aria-live="off"></div>
</div>

<div id="stage">

  <!-- shared top half: header, info panel, picture-in-picture frame -->
  <div id="top">
    <div id="hdr">
      <img id="logo" src="assets/comcast_logo_white.svg" alt="comcast" draggable="false">
      <div id="tvl">TV Listings</div>
      <div id="clock">12:00am</div>
      <div id="tvg"><img src="assets/tvguide_logo.svg" alt="TV Guide" draggable="false"></div>
    </div>

    <div id="info">
      <div id="i-head"><span class="on-logo">ON</span><span id="i-head-t"></span></div>
      <div id="i-title"></div>
      <div id="i-chan"></div>
      <div id="i-time"></div>
      <div id="i-icons"></div>
      <div id="i-desc"></div>
    </div>

    <div id="pipframe"><div id="pipslot"></div></div>
  </div>

  <!-- ===================== GUIDE ===================== -->
  <div id="guide">
    <div id="timebar">
      <div id="tb-day">Today</div>
      <div class="tb-sep" style="left:166px"></div>
      <svg id="tb-icon" viewBox="0 0 38 28" aria-hidden="true">
        <g fill="#fff">
          <rect x="1" y="1" width="25" height="3.4"/>
          <rect x="1" y="7.2" width="25" height="3.4"/>
          <rect x="1" y="13.4" width="14" height="3.4"/>
          <rect x="1" y="19.6" width="14" height="3.4"/>
        </g>
        <circle cx="26" cy="17" r="9.6" fill="#fff" stroke="#0b2a4f" stroke-width="1.6"/>
        <path d="M26,10.5 V17.4 H31.2" fill="none" stroke="#0b2a4f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="tb-time" id="tb-t0"></div>
      <div class="tb-sep" style="left:362px"></div>
      <div class="tb-time" id="tb-t1"></div>
      <div class="tb-sep" style="left:558px"></div>
      <div class="tb-time" id="tb-t2"></div>
      <div class="tb-sep" style="left:754px"></div>
      <div class="tb-time wide-only" id="tb-t3"></div>
      <div class="tb-sep wide-only" style="left:950px"></div>
      <svg id="tb-arrow" viewBox="0 0 10 16" aria-hidden="true"><path d="M1,1 L9,8 L1,15 Z" fill="#fff"/></svg>
    </div>

    <div id="grid">
      <div id="chans"></div>
      <div id="stripe"></div>
      <div id="progs"></div>
      <div id="empty"></div>
    </div>

    <div id="footer"></div>

    <!-- Search (channels): the on-screen keyboard (keyboard.js) in place of the listings -->
    <div id="g-search"></div>
    <div id="g-foot"><div id="g-hint"></div></div>
  </div>

  <!-- ===================== ON DEMAND =====================
       Replaces the guide's listings below the shared top half, as the
       original's ON DEMAND Menu did: rounded buttons, two to a row (one wide
       one per row for titles), "More ▼ Choices" when there are more. -->
  <div id="vod">
    <div id="v-menu">
      <div id="v-btns"></div>
      <div id="v-empty"></div>
      <div id="v-more">
        <span>More</span>
        <svg id="v-up" viewBox="0 0 22 13" aria-label="Previous choices"><path d="M1,12 L11,1 L21,12 Z"/></svg>
        <svg id="v-down" viewBox="0 0 22 13" aria-label="More choices"><path d="M1,1 L11,12 L21,1 Z"/></svg>
        <span>Choices</span>
      </div>
    </div>
    <div id="v-foot"><div id="v-hint"></div><div id="v-pos"></div></div>
  </div>

  <!-- ===================== SETTINGS (full screen) ===================== -->
  <div id="menu">
    <div id="m-hdr">
      <img id="m-logo" src="assets/comcast_logo_white.svg" alt="comcast" draggable="false">
      <div id="m-name">Settings</div>
      <div id="m-clock">12:00am</div>
    </div>
    <div id="m-bar">
      <svg id="m-icon" viewBox="0 0 38 28" aria-hidden="true">
        <g fill="#fff">
          <rect x="1" y="2" width="5" height="4"/><rect x="9" y="2" width="27" height="4"/>
          <rect x="1" y="12" width="5" height="4"/><rect x="9" y="12" width="27" height="4"/>
          <rect x="1" y="22" width="5" height="4"/><rect x="9" y="22" width="27" height="4"/>
        </g>
      </svg>
      <div id="m-title"></div>
      <div id="m-pos"></div>
    </div>
    <div id="m-body">
      <div id="m-cats"></div>
      <div id="m-stripe"></div>
      <div id="m-list"><div id="m-rows"></div></div>
    </div>
    <div id="m-info">
      <div id="mi-title"></div>
      <div id="mi-chan"></div>
      <div id="mi-desc"></div>
    </div>
    <div id="m-foot"><div id="m-hint"></div></div>
  </div>

  <!-- ===================== PLAYER OVERLAYS ===================== -->
  <!-- channel number entry while watching -->
  <div id="osd-num"></div>

  <!-- transient messages: "Closed Captions: English", "Subtitle Offset +0.5s" -->
  <div id="osd"></div>

  <!-- info banner shown on tune / Info -->
  <div id="banner">
    <div id="b-top">
      <div id="b-title"></div>
      <div id="b-chan"></div>
      <div id="b-sep"></div>
      <div id="b-clock"></div>
    </div>
    <div id="b-body">
      <div id="b-time"></div>
      <div id="b-desc"></div>
    </div>
  </div>

  <!-- trick-play / program progress bar -->
  <div id="pbar">
    <div id="pb-ctl">
      <div class="pb-btn txt" data-act="subs" title="Subtitle Options (Shift+C)">CC</div>
      <div class="pb-btn txt" data-act="screen" title="Display Options (Shift+F)">Display</div>
      <div class="pb-btn txt" data-act="ondemand" title="On Demand (O)">On Demand</div>
      <div class="pb-btn txt" data-act="menu" title="Settings (F1)">Settings</div>
    </div>
    <div id="pb-top">
      <div id="pb-title"></div>
      <div id="pb-chan"></div>
    </div>
    <div id="pb-bar">
      <div id="pb-left"></div>
      <div id="pb-track"><div id="pb-fill"></div><div id="pb-mark"></div></div>
      <div id="pb-right"></div>
    </div>
    <div id="pb-tab">
      <span id="pb-pos"></span>
      <svg id="pb-state" viewBox="0 0 24 16"><path d=""/></svg>
    </div>
  </div>

  <!-- pop-out options over the picture: Subtitle Options, Display Options -->
  <div id="pnl">
    <div id="pnl-title"></div>
    <div id="pnl-rows"></div>
    <div id="pnl-desc"></div>
    <div id="pnl-hint"></div>
  </div>

  <!-- ===================== DIALOG ===================== -->
  <div id="dlg">
    <div id="dlg-box">
      <div id="dlg-title"></div>
      <div id="dlg-body">
        <div id="dlg-text"></div>
        <div id="dlg-big"></div>
        <div id="dlg-items"></div>
      </div>
    </div>
  </div>
</div>

<input type="file" id="file-m3u" accept=".m3u,.m3u8,.txt,audio/x-mpegurl,application/vnd.apple.mpegurl" multiple hidden>
<input type="file" id="file-sub" accept=".srt,.vtt" hidden>

<script src="js/util.js"></script>
<script src="js/m3u.js"></script>
<script src="js/zlive.js"></script>
<script src="js/logos.js"></script>
<script src="js/xmltv.js"></script>
<script src="js/subs.js"></script>
<script src="js/store.js"></script>
<script src="js/dialog.js"></script>
<script src="js/sync.js"></script>
<script src="js/panel.js"></script>
<script src="js/keyboard.js"></script>
<script src="js/player.js"></script>
<script src="js/main.js"></script>
<script src="js/settings.js"></script>
<script src="js/ondemand.js"></script>
<script src="js/plex.js"></script>
</body>
</html>
