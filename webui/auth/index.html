<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>TV Listings</title>
<link rel="stylesheet" href="/auth/auth.css">
</head>
<body>
<!--
  Sign-in, account and Users pages: one page, drawn by auth.js from the path
  (/auth/login, /auth/account, /auth/users, /auth/recovery, /auth/error,
  /auth/logout). Public: nginx lets these through without a session.
  #wrap is scaled to fit small TV screens (fit() in auth.js).
-->
<div id="wrap">
  <header id="hdr">
    <img id="logo" src="/assets/comcast_logo_white.svg" alt="" draggable="false">
    <div id="tvl">TV Listings</div>
  </header>
  <main id="box" aria-live="polite">
    <h1 id="title"></h1>
    <div id="body"><p class="note">Loading...</p></div>
  </main>
</div>
<script src="/auth/auth.js"></script>
</body>
</html>
