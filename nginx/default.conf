# nginx for Watchening: the web UI's files, the guide listings, and the doors
# to the other services. Everything except the sign-in pages needs a signed-in
# visitor (asked of the accounts service on each request), or, with sign-in
# turned off in .env, a visitor on the home network.
#
#   /            the app (webui/)                     signed in
#   /epg/        guide listings from the epg service  signed in
#   /proxy/      MediaFlow Proxy (streams, playlists) signed in; nginx adds
#                MediaFlow's password, so browsers never see it
#   /stt         voice search (speech service)        signed in
#   /auth/      sign-in, account and Users pages     public
#   /kratos/     Ory Kratos's browser API             public (rate-limited)
#   /api/        the accounts service                 checks for itself
#
# A reverse proxy in front (Traefik) does https. See docs/REMINDERS.md.

# Docker's DNS, looked up per request: a restarted container's new address is
# picked up, and nginx starts even if one of them isn't running yet.
resolver 127.0.0.11 valid=10s ipv6=off;

# Behind a reverse proxy, take the visitor's address from X-Forwarded-For, but
# only when the proxy is on a private network (Traefik on this host). Add the
# proxy's own ranges in trusted-proxies.conf if it's somewhere else.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from 127.0.0.0/8;
set_real_ip_from fc00::/7;
include /etc/nginx/trusted-proxies.conf;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# The address and scheme the visitor used, as the proxy in front saw them.
map $http_x_forwarded_proto $site_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Page loads that aren't signed in go to the sign-in page; scripts get a 401.
map "$http_sec_fetch_dest|$http_accept" $wants_page {
    default         0;
    "~^document\|"  1;
    "~^\|.*text/html" 1;
}

# Sign-in attempts per address: 10 a minute, bursts of 10. Only POSTs count.
map $request_method $signin_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $signin_key zone=signin:10m rate=10r/m;
# Voice search clips per address: 30 a minute, bursts of 10 (each one is CPU work).
limit_req_zone $binary_remote_addr zone=speech:10m rate=30r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64k;
    server_tokens off;
    absolute_redirect off;   # "Location: /auth/login", whatever address was used

    # Text assets compress well; the lineup file is large.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml text/xml application/xml application/json;

    # (add_header in a location would drop these, so locations don't use it)
    # Revalidate on every load so updated files are picked up right away.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ------------------------------------------------ signed-in visitors only
    auth_request /_auth;
    error_page 401 = @signin;

    location / {
        try_files $uri $uri/ =404;
    }

    # Written by the epg service.
    location /epg/ {
        alias /srv/epg/;
    }

    # MediaFlow Proxy: plays http:// streams on an https:// page, and streams
    # and playlists whose servers don't allow web pages (CORS). Its playlist
    # rewriting builds links from Host and X-Forwarded-Proto, so pass the
    # visitor's. The include sets the api_password header.
    location /proxy/ {
        set $mediaflow http://mediaflow:8888;
        proxy_pass $mediaflow;
        include /etc/nginx/mediaflow-password.conf;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $site_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Cookie "";
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # live streams never end: pass bytes straight through
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
        # MediaFlow allows any site to read its answers (CORS *); only our
        # own pages use it here, so don't pass that on.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
        proxy_hide_header Access-Control-Expose-Headers;
    }

    # Voice search (webui/js/voice.js): a few seconds of 16 kHz WAV in, the
    # words out (whisper.cpp's /inference; its other pages stay internal).
    # The page only sends recordings over https:// (or to localhost). A clip
    # is small enough to stay in nginx's memory, never in its temp files.
    location = /stt {
        limit_except POST { deny all; }
        limit_req zone=speech burst=10 nodelay;
        client_max_body_size 1m;
        client_body_buffer_size 1m;
        set $speech http://speech:8080/inference;
        proxy_pass $speech;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_read_timeout 30s;
        gzip off;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Headers;
    }

    # ----------------------------------------------------------------- public
    location = /healthz {
        auth_request off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The sign-in, account and Users pages (one page; the script reads the path).
    location /auth/ {
        auth_request off;
        try_files $uri /auth/index.html;
    }
    location /fonts/ {
        auth_request off;
    }
    location = /favicon.ico {
        auth_request off;
        access_log off;
        try_files $uri =204;
    }
    location = /assets/comcast_logo_white.svg {
        auth_request off;
    }

    # Kratos's public API, for the sign-in pages. Its redirects name the
    # address in .env; make them relative so any address used to reach this
    # server (a LAN IP, say) keeps working.
    location /kratos/ {
        auth_request off;
        limit_req zone=signin burst=10 nodelay;
        set $kratos http://kratos:4433;   # (before rewrite...break, which skips later sets)
        rewrite ^/kratos/(.*)$ /$1 break;
        proxy_pass $kratos;
        proxy_redirect ~^https?://[^/]+(/.*)$ $1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $site_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # The accounts service checks the session itself.
    location /api/ {
        auth_request off;
        client_max_body_size 64m;   # playlist files saved with settings (auth/settings.mjs)
        set $accounts http://accounts:3000;
        proxy_pass $accounts;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $site_proto;
    }

    # ----------------------------------------------------------- the checking
    location = /_auth {
        internal;
        auth_request off;
        set $check http://accounts:3000/check;
        proxy_pass $check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto $site_proto;
    }

    location @signin {
        auth_request off;
        if ($wants_page) {
            # (the sign-in page reads everything after return_to= as is)
            return 302 /auth/login?return_to=$request_uri;
        }
        default_type application/json;
        return 401 '{"error":"Sign in first"}\n';
    }
}
