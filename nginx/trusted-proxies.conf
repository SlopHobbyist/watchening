# Reverse proxies whose X-Forwarded-For nginx should believe, besides the
# private ranges in default.conf (a Traefik container on this host is already
# covered). One "set_real_ip_from <range>;" per line.
#
# Behind Cloudflare: Traefik should be the one trusting Cloudflare's ranges
# (forwardedHeaders.trustedIPs on its entrypoint), so that it passes the
# visitor's real address along. Only list Cloudflare here if Cloudflare
# connects to this nginx directly. Ranges: https://www.cloudflare.com/ips/
